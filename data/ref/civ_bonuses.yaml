# Bonos de civilización, modelados a mano con su efecto numérico.
#
# Por qué existe este archivo: el tech tree trae los bonos SÓLO como texto — `civs.<Civ>.meta`
# viene vacío. Sin esto no se puede calcular cuántos recursos vale un bono al minuto X.
#
# Reglas:
#   - `texto_en` es la cita textual del juego (locale en). Se usa el inglés porque el español es
#     ambiguo justo donde importa: "recolectores" traduce "foragers", que son sólo los de bayas.
#   - `tipo` + `efecto` es lo que el motor puede calcular. Lo que no se puede modelar va con
#     tipo `otro`: se muestra al usuario, pero no entra en ninguna cuenta.
#   - `favorece` sale del propio texto del bono (si nombra la línea de scouts, favorece scouts).
#     No es opinión: si el bono no nombra nada, la lista va vacía.
#
# Cobertura: las 16 civs más jugadas del ladder por play rate (patch 162286), que suman ~48 %
# de las partidas. El resto se responde con estadística y tech tree, sin cálculo de bonos.

version: 1

civs:
  mongols:
    bonos:
      - texto_en: Hunters work +40% faster
        tipo: gather_rate
        efecto: {tarea: caza y jabali, multiplicador: 1.40}
        favorece: [scouts, maa_archers, drush_fc]
      - texto_en: Cavalry Archers attack +25% faster
        tipo: otro
        favorece: []
      - texto_en: Scout Cavalry-line and Steppe Lancers +20/30% HP in Castle/Imperial Age
        tipo: stat_unidad
        efecto: {unidad: scout cavalry, stat: hp, multiplicador: 1.20, desde_edad: castle}
        favorece: [scouts]

