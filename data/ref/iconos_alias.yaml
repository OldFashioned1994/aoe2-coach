# Íconos de los build orders → palabra legible en español.
#
# Los builds de rtsbuilds escriben los pasos con marcadores tipo
# `@resource/MaleVillDE.webp@`, que sin traducir quedan como "MaleVill" o "Aoe2de wood" en
# medio de la frase. Esto es traducción nuestra, no dato del juego: sólo cambia cómo se lee
# el paso, nunca lo que el paso dice que hagas.
#
# La clave es el nombre del archivo sin extensión y sin los sufijos DE / _aoe2de / _alpha.
# Lo que no figure acá se muestra con su nombre original, que es feo pero honesto.

version: 1

